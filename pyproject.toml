[project]
name = "sunrise-sunset-calendar"
# A placeholder, never bumped: each push to main publishes its image as
# latest and sha-<commit>, and the git tag vX.Y.Z that auto-release creates
# marks a changelog entry with no image of its own. Nothing reads this field
# at run time.
version = "0.0.0"
description = "iCalendar feed of sunrise, sunset, twilight and moon phases for any location, computed from the JPL DE442 ephemeris"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michele Bologna" }]
# The Python the Dockerfile's base image ships; Renovate moves the image,
# a person moves this floor with the next minor.
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "skyfield>=1.55",
    # Pinned so the golden feeds stay put; when Renovate moves it on, the
    # zones the tz release changed are recorded again (tests/golden).
    "tzdata==2026.6",
    "waitress>=3.0.2",
]

[project.scripts]
sunrise-sunset-calendar = "sunrise_sunset_calendar.app:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]

[tool.uv]
required-version = ">=0.12.12"
# Resolve only releases at least 7 days old, so a compromised release has
# time to be caught and yanked before it lands in uv.lock. For an urgent
# fix, add `<name> = false` to exclude-newer-package and run `uv lock`.
exclude-newer = "7 days"

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (the formatter handles it)
    # The strings are prose: typographic quotes, dashes and the multiplication sign are intended
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S310", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# The pre-commit hook passes mypy only the staged files: without this, a
# commit that touches only tests checks them against an unresolved package
# (every import Any) and leaves a cache that fails the next full run.
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# In parallel; tests/golden groups its cases by place, so a worker keeps that place's searches cached
addopts = "-v --strict-markers -n auto --dist loadgroup"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["sunrise_sunset_calendar"]
branch = true
# `python -m sunrise_sunset_calendar` only calls main().
omit = ["*/__main__.py"]

[tool.coverage.report]
# CI fails below this total (python-ci and ci-templates' python-test read
# it). Raise it with the tests; don't lower it to merge.
fail_under = 80
show_missing = true
skip_covered = true
