name: Commits

# Pull requests merge with a merge commit, so every commit lands on the
# default branch as it is, and auto-release reads the subjects: each must
# follow the commit rules (mbologna/commitlint-config), and no fixup! commit
# may remain.

"on":
  pull_request:

# contents: the commit check clones the history, which a private repository
# allows only with the token.
permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    uses: mbologna/.github/.github/workflows/commits.yml@d17b76ff2f8404153bf1fa08e875e6972b046c09 # main
