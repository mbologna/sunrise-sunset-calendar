name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  test:
    uses: mbologna/.github/.github/workflows/php-ci.yml@e0ca3700bd9629e5d400755fbb8bb6e3740d9bf2 # main
    with:
      php_version: "8.5"
      php_extensions: "mbstring, json"
      enable_test: true
      enable_composer_cache: true
      test_command: vendor/bin/phpunit --testdox && composer analyse && composer lint

  lint:
    uses: mbologna/.github/.github/workflows/php-ci.yml@e0ca3700bd9629e5d400755fbb8bb6e3740d9bf2 # main
    with:
      php_version: "8.5"
      enable_test: false
      enable_lint: true
      lint_tools: ""
      lint_command: >-
        find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null &&
        ! grep -rEn '\b(eval|exec|system|shell_exec|passthru)\(' --include='*.php' --exclude-dir=vendor . &&
        ! grep -rn '\$_REQUEST' --include='*.php' --exclude-dir=vendor .

  docker:
    needs: [test, lint]
    uses: mbologna/.github/.github/workflows/docker-ci.yml@e0ca3700bd9629e5d400755fbb8bb6e3740d9bf2 # main
    with:
      image_name: sunrise-sunset-calendar
      push_to_dockerhub: true
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit

  auto-release:
    # Monday's schedule and a manual run release with the strategy below; a push
    # to the default branch releases only a CVE fix (the wrapper switches to the
    # security strategy). The tag build auto-release dispatches runs on the tag
    # ref, so it does not release again.
    if: >-
      github.event_name == 'schedule' ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # contents: push the tag and create the Release; actions: dispatch this
    # workflow on it, since a tag pushed with GITHUB_TOKEN triggers no run.
    permissions:
      contents: write
      actions: write
    needs: [docker]
    uses: mbologna/.github/.github/workflows/auto-release.yml@e0ca3700bd9629e5d400755fbb8bb6e3740d9bf2 # main
    with:
      strategy: docker
      image: docker.io/mbologna/sunrise-sunset-calendar
    secrets: inherit

  deploy:
    needs: [docker]
    # A push to main only: Renovate merges in the Tue/Wed/Thu window (CVE fixes
    # at any time), and that merge is the deploy. Monday's schedule rebuilds the
    # same pinned base image, so redeploying it only moved a deploy out of the
    # window.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: mbologna/.github/.github/workflows/gcp-deploy.yml@e0ca3700bd9629e5d400755fbb8bb6e3740d9bf2 # main
    with:
      image_name: sunrise-sunset-calendar
      deploy_type: service
      deploy_name: sunrise-sunset-calendar
      region: us-central1
    secrets: inherit

  cache-cleanup:
    if: github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/cache-cleanup.yml@e0ca3700bd9629e5d400755fbb8bb6e3740d9bf2 # main
    with:
      max_age_days: 7
    permissions:
      actions: write
