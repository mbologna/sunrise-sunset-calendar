name: CI

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be deploying or releasing,
  # and a cut release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # ruff, the tests with the coverage gate (fail_under in pyproject.toml)
  # and pip-audit on the locked runtime dependencies.
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@016832d015988220ca1ad06a483742cded255428 # main
    with:
      python_version: "3.15"
      enable_codecov: false
    secrets: inherit

  docker:
    needs: python
    # Push, sign and scan the image, and deploy it.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@016832d015988220ca1ad06a483742cded255428 # main
    with:
      image_name: sunrise-sunset-calendar
      # Every push to main publishes the image, tagged latest and
      # sha-<commit>; pull requests build it without pushing. The release
      # tags build nothing.
      publish: push
      push_to_dockerhub: false
      # tests/golden/generator/Dockerfile and http_parity.py pin the last PHP
      # release's image by this tag; the cleanup keeps only five versions.
      cleanup_keep_tags: '^sha-b47c648$'
      # Proves the image serves: starts the server, waits for it, then wants
      # the health check and a one-week feed back (on loopback: the smoke test
      # runs without network).
      smoke_cmd: 'AUTH_TOKEN=smoke CALENDAR_WINDOW_DAYS=7 sunrise-sunset-calendar & get() { python -c "import sys, urllib.request; sys.stdout.write(urllib.request.urlopen(sys.argv[1]).read().decode())" "http://127.0.0.1:8080/$1"; }; for i in $(seq 60); do get ''health'' >/dev/null 2>&1 && break; sleep 0.5; done; get ''health'' | grep -q ''"status":"ok"'' && get ''?feed=1&token=smoke&daynight=1'' | grep -q ''END:VCALENDAR'''
      # No release_strategy: its auto-release would dispatch a tag build
      # that publishes X.Y.Z images, which nothing runs. The auto-release
      # job below tags the changelog instead.
      # Points the Cloud Run service at the image digest of each push or
      # manual run on main that builds one; a docs- or CI-only push deploys
      # nothing. Needs the GCP_WORKLOAD_IDENTITY_PROVIDER and
      # GCP_SERVICE_ACCOUNT secrets.
      deploy_type: service
    secrets: inherit

  # Release tags as a changelog: Monday's schedule tags vX.Y.Z with a GitHub
  # Release of the commit subjects when a feat, fix, perf, revert or
  # breaking commit landed (or a maintenance release for dependency
  # updates), and a push to main tags only a CVE fix (a fix(security)
  # commit, or a Dockerfile base image update that fixes CVEs). A tag
  # records what main already deployed; it builds nothing.
  auto-release:
    needs: [python, docker]
    # contents: push the tag and create the Release.
    permissions:
      contents: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@016832d015988220ca1ad06a483742cded255428 # main
    with:
      strategy: conventional
      # The security strategy compares this Dockerfile's base image at the
      # last tag and at the pushed commit. No image input: there is no X.Y.Z
      # image to scan, so no fresh-rebuild release either.
      dockerfiles: Dockerfile
      dispatch_tag_build: false
    secrets: inherit
