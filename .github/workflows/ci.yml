name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@423fe81596d69d9cd74191195ee6d3af7f9bf360 # main
    with:
      python_version: "3.15"
      enable_codecov: false
      # The gate itself is fail_under in pyproject.toml ([tool.coverage.report])
    secrets: inherit

  docker:
    needs: python
    # contents: the release tag and its Release; actions: dispatch the tag
    # build (a tag pushed with GITHUB_TOKEN triggers no run); the rest:
    # push, sign and scan the image, and deploy it.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@423fe81596d69d9cd74191195ee6d3af7f9bf360 # main
    with:
      image_name: sunrise-sunset-calendar
      # push: the Cloud Run deploy runs the sha-* image of each
      # main build, so main keeps publishing.
      publish: push
      # auto-release runs inside docker-ci: Monday's schedule releases with
      # this strategy, a push to main only a CVE fix.
      release_strategy: conventional
      # Points the Cloud Run service at the image of each push or manual run
      # on main that builds one; a docs- or CI-only push deploys nothing.
      deploy_type: service
      # Proves the image serves: starts the server, waits for it, then wants
      # the health check and a one-week feed back (on loopback: the smoke test
      # runs without network).
      smoke_cmd: >-
        AUTH_TOKEN=smoke CALENDAR_WINDOW_DAYS=7 sunrise-sunset-calendar &
        get() { python -c "import sys, urllib.request; sys.stdout.write(urllib.request.urlopen(sys.argv[1]).read().decode())" "http://127.0.0.1:8080/$1"; };
        for i in $(seq 60); do get '?health' >/dev/null 2>&1 && break; sleep 0.5; done;
        get '?health' | grep -q '"status":"ok"' &&
        get '?feed=1&token=smoke&daynight=1' | grep -q 'END:VCALENDAR'
    secrets: inherit
