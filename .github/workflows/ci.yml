name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  test:
    uses: mbologna/.github/.github/workflows/php-ci.yml@ee5bcf8cd73154eaccd48e386919f73d2dd832e2 # main
    with:
      php_version: "8.5"
      php_extensions: "mbstring, json"
      enable_test: true
      enable_composer_cache: true
      test_command: vendor/bin/phpunit --testdox && composer analyse && composer lint

  lint:
    uses: mbologna/.github/.github/workflows/php-ci.yml@ee5bcf8cd73154eaccd48e386919f73d2dd832e2 # main
    with:
      php_version: "8.5"
      enable_test: false
      enable_lint: true
      lint_tools: ""
      lint_command: >-
        find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null &&
        ! grep -rEn '\b(eval|exec|system|shell_exec|passthru)\(' --include='*.php' --exclude-dir=vendor . &&
        ! grep -rn '\$_REQUEST' --include='*.php' --exclude-dir=vendor .

  docker:
    needs: [test, lint]
    # contents: the release tag and its Release; actions: dispatch the tag
    # build (a tag pushed with GITHUB_TOKEN triggers no run); the rest:
    # push, sign and scan the image, and deploy it.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@ee5bcf8cd73154eaccd48e386919f73d2dd832e2 # main
    with:
      image_name: sunrise-sunset-calendar
      # push: the Cloud Run deploy runs the sha-* image of each
      # main build, so main keeps publishing.
      publish: push
      # auto-release runs inside docker-ci: Monday's schedule releases with
      # this strategy, a push to main only a CVE fix.
      release_strategy: conventional
      # Points the Cloud Run service at the image of each push or manual run
      # on main that builds one; a docs- or CI-only push deploys nothing.
      deploy_type: service
    secrets: inherit
